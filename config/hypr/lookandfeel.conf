general {
    gaps_in = 20
    gaps_out = 30
    border_size = 2

    col.active_border = rgba(9ece6aff) rgba(e0af68ff) 45deg
    col.inactive_border = rgba(1f1f28cc)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 6

    active_opacity = 1.0
    inactive_opacity = 0.92

    dim_inactive = true
    dim_strength = 0.10
    dim_around = 0.24

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(00000099)
        color_inactive = rgba(00000055)
    }

    blur {
        enabled = true
        size = 4
        passes = 1
        new_optimizations = true
        xray = false
        popups = true
    }
}

animations {
    enabled = yes

    # Smooth but still snappy
    bezier = chillOut, 0.16, 1.00, 0.30, 1.00
    bezier = chillIn, 0.55, 0.00, 0.75, 0.20
    bezier = chillMove, 0.05, 0.90, 0.20, 1.00
    bezier = chillFade, 0.25, 0.10, 0.25, 1.00
    bezier = workspaceSwipe, 0.13, 0.90, 0.22, 1.00

    # Windows
    animation = windows, 1, 4, chillOut, popin 88%
    animation = windowsIn, 1, 4, chillOut, popin 88%
    animation = windowsOut, 1, 3, chillIn, popin 94%
    animation = windowsMove, 1, 4, chillMove, slide

    # Fades
    animation = fade, 1, 3, chillFade
    animation = fadeIn, 1, 3, chillFade
    animation = fadeOut, 1, 2, chillFade
    animation = fadeSwitch, 1, 3, chillFade
    animation = fadeShadow, 1, 3, chillFade
    animation = fadeDim, 1, 3, chillFade
    animation = border, 1, 4, chillFade

    # Workspaces
    animation = workspaces, 1, 4, workspaceSwipe, slide
    animation = workspacesIn, 1, 4, workspaceSwipe, slide
    animation = workspacesOut, 1, 4, workspaceSwipe, slide
}

gesture = 3, horizontal, workspace
gesture = 3, vertical, fullscreen

master {
    new_status = master
}

xwayland {
    force_zero_scaling = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0

    animate_manual_resizes = false

    enable_swallow = true
    swallow_regex = ^(kitty)$
}
